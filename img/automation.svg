<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Fillout form to n8n workflow (filter, clean, find existing record) to Airtable (create or update record)">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1d6b47"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Inter Tight", "Segoe UI", system-ui, sans-serif; fill: #111214; }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
    .k { font-size: 12px; fill: #8a8e95; }
    .t { font-size: 22px; font-weight: 600; }
    .s { font-size: 14px; fill: #5d6168; }
    .box { fill: #ffffff; stroke: #d6d6d2; }
    .hot { fill: #ffffff; stroke: #1d6b47; stroke-width: 1.5; }
  </style>

  <rect width="800" height="500" fill="#f7f7f5"/>

  <text class="k mono" x="40" y="60">trigger: form submitted</text>
  <text class="k mono" x="760" y="60" text-anchor="end">n8n · Fillout · Airtable</text>

  <rect class="box" x="40" y="150" width="190" height="200" rx="8"/>
  <text class="k mono" x="60" y="182">01  input</text>
  <text class="t" x="60" y="220">Fillout</text>
  <text class="s" x="60" y="248">form response</text>
  <rect x="60" y="276" width="150" height="10" rx="2" fill="#ececea"/>
  <rect x="60" y="296" width="110" height="10" rx="2" fill="#ececea"/>
  <rect x="60" y="316" width="130" height="10" rx="2" fill="#ececea"/>

  <rect class="hot" x="300" y="120" width="210" height="260" rx="8"/>
  <text class="k mono" x="320" y="152">02  workflow</text>
  <text class="t" x="320" y="190">n8n</text>
  <text class="s mono" x="320" y="230">filter</text>
  <text class="s mono" x="320" y="258">clean + normalize</text>
  <text class="s mono" x="320" y="286">find existing record</text>
  <text class="s mono" x="320" y="314">create or update</text>
  <text class="k mono" x="320" y="356">no manual copy-paste</text>

  <rect class="box" x="580" y="150" width="180" height="200" rx="8"/>
  <text class="k mono" x="600" y="182">03  output</text>
  <text class="t" x="600" y="220">Airtable</text>
  <text class="s" x="600" y="252">+ new record</text>
  <text class="s" x="600" y="278">↻ updated if it exists</text>
  <rect x="600" y="306" width="140" height="1" fill="#d6d6d2"/>
  <rect x="600" y="322" width="140" height="1" fill="#d6d6d2"/>

  <path d="M232 250H296" stroke="#1d6b47" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M512 250H576" stroke="#1d6b47" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text class="s" x="40" y="440">Every submission lands clean, without duplicates, in the right record.</text>
</svg>
