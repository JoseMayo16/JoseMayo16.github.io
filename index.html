<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juan José Mayo | Desarrollador full stack y de automatización</title>
<meta name="description" content="Desarrollador full stack y de automatización en Medellín. Flujos en n8n, integraciones con APIs y aplicaciones web con Laravel y Vue.">
<meta property="og:type" content="website">
<meta property="og:title" content="Juan José Mayo | Full stack and automation developer">
<meta property="og:description" content="n8n workflows, API integrations and web apps with Laravel and Vue. Medellín, Colombia.">
<meta property="og:url" content="https://josemayo16.github.io/">
<meta property="og:image" content="https://josemayo16.github.io/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  // Aplica el tema guardado antes de pintar para evitar parpadeo.
  try {
    var t = localStorage.getItem("theme");
    if (t) document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>

<a class="skip" href="#main">Saltar al contenido / Skip to content</a>

<div class="shell">
  <aside class="side">
    <a class="me" href="#inicio">
      <img data-photo alt="" width="40" height="40">
      <span class="me-text"><strong data-name></strong><span data-i18n="role"></span></span>
    </a>
    <p class="status" data-status><span class="dot" aria-hidden="true"></span><span data-status-text></span></p>
    <nav class="toc" aria-label="Secciones / Sections">
      <a href="#inicio" data-i18n="nav.intro"></a>
      <a href="#casos" data-i18n="nav.work"></a>
      <a href="#mercado" data-i18n="nav.market" data-market-only></a>
      <a href="#experiencia" data-i18n="nav.experience"></a>
      <a href="#servicios" data-i18n="nav.services"></a>
      <a href="#contacto" data-i18n="nav.contact"></a>
    </nav>
    <div class="side-tools">
      <div class="seg" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es">ES</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" class="icon-btn" id="theme" data-i18n-label="theme.toggle">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path class="sun" d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.41-1.41M4.93 19.07l1.41-1.41m0-11.32L4.93 4.93m14.14 14.14-1.41-1.41M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/><path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
      </button>
    </div>
  </aside>

  <main id="main">
    <section id="inicio" class="intro">
      <h1 data-i18n="hero.title"></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <dl class="spec" data-spec></dl>
      <div class="actions">
        <a class="btn btn-primary" data-email-link data-i18n="hero.cta"></a>
        <a class="btn" href="#casos" data-i18n="hero.work"></a>
      </div>
    </section>

    <section id="casos">
      <header class="sec-head">
        <h2 data-i18n="work.title"></h2>
        <p data-i18n="work.lead"></p>
      </header>
      <div class="cases" data-cases></div>
    </section>

    <section id="mercado" hidden>
      <header class="sec-head">
        <h2 data-i18n="market.title"></h2>
      </header>
      <p class="market-headline" data-market-headline></p>
      <p class="muted" data-i18n="market.lead"></p>
      <ol class="bars" data-bars></ol>
      <p class="market-meta">
        <span data-market-meta></span>
        <a data-market-link target="_blank" rel="noopener"><span data-i18n="market.link"></span> ↗</a>
      </p>
    </section>

    <section id="experiencia">
      <header class="sec-head">
        <h2 data-i18n="exp.title"></h2>
      </header>
      <ol class="rows" data-exp></ol>
      <p class="note" data-i18n="exp.note"></p>
    </section>

    <section id="servicios">
      <header class="sec-head">
        <h2 data-i18n="services.title"></h2>
      </header>
      <ul class="rows" data-services></ul>
      <h3 class="sub-title" data-i18n="process.title"></h3>
      <ol class="steps" data-steps></ol>
    </section>

    <section id="contacto">
      <header class="sec-head">
        <h2 data-i18n="contact.title"></h2>
        <p data-i18n="contact.lead"></p>
      </header>
      <ul class="rows contact" data-contact></ul>
    </section>

    <footer class="footer">
      <span>&copy; <span data-year></span> <span data-name></span></span>
      <span data-i18n="footer.made"></span>
    </footer>
  </main>
</div>

<noscript><p>Este sitio necesita JavaScript. / This site needs JavaScript.</p></noscript>
<script src="content.js"></script>
<script src="main.js"></script>
</body>
</html>
