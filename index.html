<script>

      <a href="#sobre-mi" data-i18n="nav.about"></a>
      <a href="#servicios" data-i18n="nav.services"></a>

        <a class="btn btn-primary" href="#contacto" data-i18n="hero.cta"></a>

      </div>
    </div>
    <div class="term" aria-hidden="true">
      <div class="term-bar"><i></i><i></i><i></i></div>

<span class="ok">✓</span> <span data-i18n="term.1"></span>
<span class="ok">✓</span> <span data-i18n="term.2"></span>

<span class="ok">✓</span> <span data-i18n="term.4"></span>
<span class="prompt">$</span> <span class="cursor"></span></pre>
