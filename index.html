<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juan José | Desarrollador full stack</title>
<meta name="description" content="Desarrollador full stack en Medellín. Aplicaciones web, APIs y automatización con Laravel, Vue y Python.">
<meta name="theme-color" content="#07090c">
<meta property="og:type" content="website">
<meta property="og:title" content="Juan José | Full stack developer">
<meta property="og:description" content="Web apps, APIs and automation with Laravel, Vue and Python. Medellín, Colombia.">
<meta property="og:url" content="https://josemayo16.github.io/">
<meta property="og:image" content="https://josemayo16.github.io/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip" href="#main">Saltar al contenido / Skip to content</a>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#top" aria-label="Inicio"><span class="brand-mark">JJ</span><span class="brand-sep">://</span><span class="brand-user" data-github-user></span></a>
    <nav class="nav" aria-label="Principal">
      <a href="#perfil"><span>01</span><span data-i18n="nav.about"></span></a>
      <a href="#intel" data-intel-only><span>02</span><span data-i18n="nav.intel"></span></a>
      <a href="#proyectos"><span>03</span><span data-i18n="nav.work"></span></a>
      <a href="#servicios"><span>04</span><span data-i18n="nav.help"></span></a>
      <a href="#contacto"><span>05</span><span data-i18n="nav.contact"></span></a>
    </nav>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main id="main">
  <section class="hero wrap" id="top">
    <div class="hero-copy">
      <p class="status" data-status><span class="led" aria-hidden="true"></span><span data-status-text></span></p>
      <p class="tag mono" data-i18n="hero.tag"></p>
      <h1 class="glitch" data-name></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="actions">
        <a class="btn btn-primary" href="#contacto" data-i18n="hero.cta"></a>
        <a class="btn btn-ghost" href="#proyectos" data-i18n="hero.work"></a>
      </div>
    </div>

    <aside class="player hud" aria-label="Ficha / Profile card">
      <div class="player-top">
        <div class="avatar">
          <img data-photo alt="" width="460" height="460">
        </div>
        <div class="player-id mono">
          <span class="dim">ID</span>
          <strong data-github-user></strong>
          <span class="lvl"><span class="dim">XP</span> ~3y</span>
        </div>
      </div>
      <dl class="stats">
        <div><dt data-i18n="card.class"></dt><dd data-i18n="card.classv"></dd></div>
        <div><dt data-i18n="card.xp"></dt><dd data-i18n="card.xpv"></dd></div>
        <div><dt data-i18n="card.edu"></dt><dd data-i18n="card.eduv"></dd></div>
        <div><dt data-i18n="card.base"></dt><dd data-i18n="card.basev"></dd></div>
        <div><dt data-i18n="card.lang"></dt><dd data-i18n="card.langv"></dd></div>
        <div><dt data-i18n="card.side"></dt><dd data-i18n="card.sidev"></dd></div>
      </dl>
      <div class="loadout">
        <p class="mono dim" data-i18n="card.loadout"></p>
        <ul class="chips" data-loadout></ul>
      </div>
    </aside>
  </section>

  <section id="perfil" class="section wrap about">
    <header class="head">
      <p class="kicker" data-i18n="about.kicker"></p>
      <h2 data-i18n="about.title"></h2>
    </header>
    <div class="about-body">
      <div class="about-text">
        <p data-i18n="about.p1"></p>
        <p data-i18n="about.p2"></p>
      </div>
      <div class="log">
        <p class="mono dim" data-i18n="about.log"></p>
        <ol data-log></ol>
      </div>
    </div>
  </section>

  <section id="intel" class="section wrap intel" hidden>
    <header class="head">
      <p class="kicker" data-i18n="intel.kicker"></p>
      <h2 data-i18n="intel.title"></h2>
      <p class="sub" data-i18n="intel.lead"></p>
    </header>
    <div class="panel hud">
      <p class="panel-meta mono"><span class="led" aria-hidden="true"></span><span data-intel-meta></span></p>
      <ol class="bars" data-bars></ol>
      <a class="arrow-link" data-intel-link target="_blank" rel="noopener"><span data-i18n="intel.link"></span> <span aria-hidden="true">-&gt;</span></a>
    </div>
  </section>

  <section id="proyectos" class="section wrap">
    <header class="head">
      <p class="kicker" data-i18n="work.kicker"></p>
      <h2 data-i18n="work.title"></h2>
    </header>
    <div class="cases" data-cases></div>
  </section>

  <section id="servicios" class="section wrap">
    <header class="head">
      <p class="kicker" data-i18n="help.kicker"></p>
      <h2 data-i18n="help.title"></h2>
    </header>
    <ul class="help" data-help></ul>
    <p class="mono dim flow-title" data-i18n="help.flow"></p>
    <ol class="flow" data-steps></ol>
  </section>

  <section id="contacto" class="section wrap contact">
    <header class="head">
      <p class="kicker" data-i18n="contact.kicker"></p>
      <h2 data-i18n="contact.title"></h2>
      <p class="sub" data-i18n="contact.lead"></p>
    </header>
    <div class="contact-links" data-contact></div>
  </section>
</main>

<footer class="footer wrap mono">
  <span>&copy; <span data-year></span> <span data-name></span></span>
  <span data-i18n="footer.made"></span>
  <span class="dim" aria-hidden="true">&uarr;&uarr;&darr;&darr;&larr;&rarr;&larr;&rarr;BA</span>
</footer>

<div class="toast hud" role="status" aria-live="polite" hidden>
  <p class="mono toast-title" data-i18n="egg.title"></p>
  <p data-i18n="egg.text"></p>
</div>

<noscript><p class="wrap">Este sitio necesita JavaScript. / This site needs JavaScript.</p></noscript>
<script src="content.js"></script>
<script src="main.js"></script>
</body>
</html>
